apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: flask-app-scaler
  namespace: flask-app
spec:
  scaleTargetRef:
    name: flask-app 
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30 
  cooldownPeriod: 300 
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        query: sum(kepler_node_package_joules_total)
        threshold: '50'
