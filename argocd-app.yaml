apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cak8s-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  project: default
  source:
    repoURL: https://github.com/wh102/Carbon-aware-K8s-Project.git
    targetRevision: main
    path: k8s-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: flask-app
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: flask-app
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
