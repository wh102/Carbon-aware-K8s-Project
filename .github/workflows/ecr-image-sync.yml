name: ECR Image Sync

on:
  workflow_dispatch: 

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
     
      - name: Set AWS Account ID
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV
      
      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password \
            --region ${{ secrets.AWS_REGION }} | \
            docker login \
            --username AWS \
            --password-stdin ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and Push ARM64 Images
        run: |
          set -e
          echo "=== Metrics Server ==="
          docker pull --platform linux/arm64 registry.k8s.io/metrics-server/metrics-server:v0.8.0
          docker tag registry.k8s.io/metrics-server/metrics-server:v0.8.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/k8s-metrics-server:v0.8.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/k8s-metrics-server:v0.8.0

          echo "=== KEDA ==="
          docker pull --platform linux/arm64 ghcr.io/kedacore/keda:2.18.3
          docker tag ghcr.io/kedacore/keda:2.18.3 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda:2.18.3
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda:2.18.3

          docker pull --platform linux/arm64 ghcr.io/kedacore/keda-metrics-apiserver:2.18.3
          docker tag ghcr.io/kedacore/keda-metrics-apiserver:2.18.3 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda-metrics-apiserver:2.18.3
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda-metrics-apiserver:2.18.3

          docker pull --platform linux/arm64 ghcr.io/kedacore/keda-admission-webhooks:2.18.3
          docker tag ghcr.io/kedacore/keda-admission-webhooks:2.18.3 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda-admission-webhooks:2.18.3
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/keda-admission-webhooks:2.18.3

          echo "=== Grafana ==="
          docker pull --platform linux/arm64 docker.io/grafana/grafana:12.4.3
          docker tag docker.io/grafana/grafana:12.4.3 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/grafana:12.4.3
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/grafana:12.4.3

          echo "=== Prometheus ==="
          docker pull --platform linux/arm64 quay.io/prometheus/prometheus:v3.11.2
          docker tag quay.io/prometheus/prometheus:v3.11.2 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus:v3.11.2
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus:v3.11.2

          docker pull --platform linux/arm64 quay.io/prometheus-operator/prometheus-operator:v0.90.1
          docker tag quay.io/prometheus-operator/prometheus-operator:v0.90.1 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus-operator:v0.90.1
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus-operator:v0.90.1
          
          docker pull --platform linux/arm64 quay.io/prometheus/alertmanager:v0.32.0
          docker tag quay.io/prometheus/alertmanager:v0.32.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/alertmanager:v0.32.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/alertmanager:v0.32.0
          
          docker pull --platform linux/arm64 quay.io/prometheus/node-exporter:v1.11.1
          docker tag quay.io/prometheus/node-exporter:v1.11.1 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/node-exporter:v1.11.1
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/node-exporter:v1.11.1
          
          docker pull --platform linux/arm64 registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0
          docker tag registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.18.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/kube-state-metrics:v2.18.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/kube-state-metrics:v2.18.0
          
          docker pull --platform linux/arm64 ghcr.io/jkroepke/kube-webhook-certgen:1.8.0
          docker tag ghcr.io/jkroepke/kube-webhook-certgen:1.8.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/kube-webhook-certgen:1.8.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/kube-webhook-certgen:1.8.0

          docker pull --platform linux/arm64 quay.io/kiwigrid/k8s-sidecar:2.6.0
          docker tag quay.io/kiwigrid/k8s-sidecar:2.6.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/k8s-sidecar:2.6.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/k8s-sidecar:2.6.0
          
          docker pull --platform linux/arm64 quay.io/prometheus-operator/prometheus-config-reloader:v0.90.1
          docker tag quay.io/prometheus-operator/prometheus-config-reloader:v0.90.1 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus-config-reloader:v0.90.1
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/prometheus-config-reloader:v0.90.1

          echo "=== EBS CSI Driver ==="
          docker pull --platform linux/arm64 public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver:v1.31.0
          docker tag public.ecr.aws/ebs-csi-driver/aws-ebs-csi-driver:v1.31.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aws-ebs-csi-driver:v1.31.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aws-ebs-csi-driver:v1.31.0

          docker pull --platform linux/arm64 registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
          docker tag registry.k8s.io/sig-storage/csi-provisioner:v5.2.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-provisioner:v5.2.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-provisioner:v5.2.0
          
          docker pull --platform linux/arm64 registry.k8s.io/sig-storage/csi-attacher:v4.8.1
          docker tag registry.k8s.io/sig-storage/csi-attacher:v4.8.1 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-attacher:v4.8.1
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-attacher:v4.8.1
          
          docker pull --platform linux/arm64 registry.k8s.io/sig-storage/csi-resizer:v1.13.2
          docker tag registry.k8s.io/sig-storage/csi-resizer:v1.13.2 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-resizer:v1.13.2
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-resizer:v1.13.2
      
          docker pull --platform linux/arm64 registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0
          docker tag registry.k8s.io/sig-storage/csi-snapshotter:v8.2.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-snapshotter:v8.2.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csi-snapshotter:v8.2.0
          
          docker pull --platform linux/arm64 registry.k8s.io/sig-storage/livenessprobe:v2.15.0
          docker tag registry.k8s.io/sig-storage/livenessprobe:v2.15.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/livenessprobe:v2.15.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/livenessprobe:v2.15.0

          echo "=== AWS Load Balancer Controller ==="
          docker pull --platform linux/arm64 public.ecr.aws/eks/aws-load-balancer-controller:v2.17.0
          docker tag public.ecr.aws/eks/aws-load-balancer-controller:v2.17.0 ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aws-load-balancer-controller:v2.17.0
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/aws-load-balancer-controller:v2.17.0

          echo "=== Busybox ==="
          docker pull --platform linux/arm64 docker.io/busybox:latest
          docker tag docker.io/busybox:latest ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/busybox:latest
          docker push ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/busybox:latest


      - name: Build and push Kepler ARM64
        run: |
          set -e
          echo "=== Kepler ==="
          git clone --depth 1 https://github.com/sustainable-computing-io/kepler.git
          cd kepler

          docker buildx build \
            --platform linux/arm64 \
            -t ${{ env.ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/kepler:v0.11.4-arm64 \
            --build-arg GIT_COMMIT=$(git rev-parse HEAD) \
            --build-arg GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) \
            --build-arg VERSION=v0.11.4 \
            --push .
