apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cak8s-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.comw/h102/Carbon-aware-K8s-Project.git
    targetRevision: HEAD
    path: k8s-manifests 
  destination:
    server: https://kubernetes.default.svc
    namespace: flask-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
